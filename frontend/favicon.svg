<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background: transparent -->

  <!-- Row 1 -->
  <!-- Top-left: dark navy filled square -->
  <rect x="5" y="5" width="28" height="28" rx="5" fill="#1a3a6b"/>
  <!-- Top-middle: dark navy with white circle (connector node) -->
  <rect x="37" y="5" width="28" height="28" rx="5" fill="#1a3a6b"/>
  <circle cx="51" cy="19" r="5" fill="white"/>
  <!-- Top-right: light grey (inactive) -->
  <rect x="69" y="5" width="28" height="28" rx="5" fill="#e2e6ea"/>

  <!-- Connectors row 1 -->
  <line x1="33" y1="19" x2="37" y2="19" stroke="#1a3a6b" stroke-width="2.5"/>
  <line x1="19" y1="33" x2="19" y2="40" stroke="#1a3a6b" stroke-width="2.5"/>
  <line x1="83" y1="33" x2="83" y2="40" stroke="#1a3a6b" stroke-width="2.5"/>

  <!-- Row 2 -->
  <!-- Middle-left: light grey (inactive) -->
  <rect x="5" y="37" width="28" height="28" rx="5" fill="#e2e6ea"/>
  <!-- Connector dot -->
  <circle cx="19" cy="51" r="3.5" fill="#1a3a6b"/>
  <line x1="22.5" y1="51" x2="37" y2="51" stroke="#1a3a6b" stroke-width="2.5"/>

  <!-- Middle-center: bright blue (active/highlight) -->
  <rect x="37" y="37" width="28" height="28" rx="5" fill="#3b9fd4"/>
  <!-- Connector right -->
  <line x1="65" y1="51" x2="69" y2="51" stroke="#1a3a6b" stroke-width="2.5"/>

  <!-- Middle-right: dark navy with white circle -->
  <rect x="69" y="37" width="28" height="28" rx="5" fill="#1a3a6b"/>
  <circle cx="83" cy="51" r="5" fill="white"/>

  <!-- Connectors row 2 to row 3 -->
  <line x1="51" y1="65" x2="51" y2="69" stroke="#1a3a6b" stroke-width="2.5"/>
  <line x1="83" y1="65" x2="83" y2="69" stroke="#1a3a6b" stroke-width="2.5"/>

  <!-- Row 3 -->
  <!-- Bottom-left: dark navy filled -->
  <rect x="5" y="69" width="28" height="28" rx="5" fill="#1a3a6b"/>
  <!-- Bottom-middle: dark navy with white circle -->
  <rect x="37" y="69" width="28" height="28" rx="5" fill="#1a3a6b"/>
  <circle cx="51" cy="83" r="5" fill="white"/>
  <!-- Connector right from bottom-middle -->
  <line x1="65" y1="83" x2="72" y2="83" stroke="#1a3a6b" stroke-width="2.5"/>
  <circle cx="72" cy="83" r="3.5" fill="#1a3a6b"/>
  <line x1="75.5" y1="83" x2="83" y2="83" stroke="#1a3a6b" stroke-width="2.5"/>
  <circle cx="83" cy="83" r="3.5" fill="#1a3a6b"/>

  <!-- Bottom-right: light grey (inactive) -->
  <rect x="69" y="69" width="28" height="28" rx="5" fill="#e2e6ea"/>
</svg>
